name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core package and checks
        run: python -m pip install . pytest ruff build
      - name: Test
        run: python -m pytest tests -q
      - name: Lint
        run: python -m ruff check poliora tests examples/cost_tracking.py scripts/smoke_install.py
      - name: Build distributions
        run: python -m build
      - name: Inspect release contents
        run: python scripts/release_check.py
      - name: Smoke-test installed dashboard
        run: python scripts/smoke_install.py
