name: Publish Poliora release

on:
  push:
    branches:
      - "codex/pilot-readiness-*"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release tools
        run: python -m pip install . pytest ruff build
      - name: Verify package
        run: |
          python -m ruff check poliora tests examples scripts
          python -m pytest -q
          python -m build
          python scripts/release_check.py
          python scripts/smoke_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build desktop installer with its own runtime
        run: |
          python -m pip install . pyinstaller
          pyinstaller --noconfirm --clean Poliora-Engine-Win.spec
          python scripts/smoke_desktop.py dist/Poliora.exe
          choco install innosetup --no-progress -y
          $version = python -c "from poliora import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "installer\Poliora.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: artifacts/Poliora-Setup-Windows.exe

  macos-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: Intel
          - runner: macos-15
            architecture: AppleSilicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build standalone macOS app
        run: |
          python -m pip install . pyinstaller pyobjc
          mkdir -p build/poliora.iconset
          sips -z 16 16 assets/poliora-mark.png --out build/poliora.iconset/icon_16x16.png
          sips -z 32 32 assets/poliora-mark.png --out build/poliora.iconset/icon_16x16@2x.png
          sips -z 32 32 assets/poliora-mark.png --out build/poliora.iconset/icon_32x32.png
          sips -z 64 64 assets/poliora-mark.png --out build/poliora.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/poliora-mark.png --out build/poliora.iconset/icon_128x128.png
          sips -z 256 256 assets/poliora-mark.png --out build/poliora.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/poliora-mark.png --out build/poliora.iconset/icon_256x256.png
          sips -z 512 512 assets/poliora-mark.png --out build/poliora.iconset/icon_256x256@2x.png
          sips -z 512 512 assets/poliora-mark.png --out build/poliora.iconset/icon_512x512.png
          cp assets/poliora-mark.png build/poliora.iconset/icon_512x512@2x.png
          iconutil -c icns build/poliora.iconset -o build/poliora.icns
          pyinstaller --noconfirm --clean --windowed --name Poliora --icon build/poliora.icns --hidden-import webview.platforms.cocoa --collect-data webview poliora/app_launcher.py
          mkdir -p artifacts
          dist/Poliora.app/Contents/MacOS/Poliora --version
          python scripts/smoke_desktop.py dist/Poliora.app/Contents/MacOS/Poliora
          ditto -c -k --sequesterRsrc --keepParent dist/Poliora.app artifacts/Poliora-macOS-${{ matrix.architecture }}.zip
          if [ "${{ matrix.architecture }}" = "Intel" ]; then
            cp artifacts/Poliora-macOS-Intel.zip artifacts/Poliora-macOS.zip
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-${{ matrix.architecture }}
          path: artifacts/Poliora-macOS*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, windows-desktop, macos-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate download checksums
        working-directory: release-assets
        run: sha256sum -- *.exe *.zip *.whl *.tar.gz > SHA256SUMS.txt
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
